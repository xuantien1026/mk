# Build MK.zip for the client: the Illustrator scripts plus a portable node.exe and
# node_modules, so it runs after unzipping — no Node install, no npm install.
# Push a tag to publish it as a GitHub Release:
#   git tag v1.0.0 && git push origin v1.0.0
# The client's download link always points at the newest release:
#   https://github.com/xuantien1026/mk/releases/latest/download/MK.zip

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release

env:
  NODE_VERSION: 24.12.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download portable node.exe
        run: |
          name=node-v$NODE_VERSION-win-x64
          base=https://nodejs.org/dist/v$NODE_VERSION
          curl -fsSLO "$base/$name.zip"
          curl -fsSL "$base/SHASUMS256.txt" | grep " $name.zip\$" | sha256sum -c -
          unzip -q -j "$name.zip" "$name/node.exe" -d nester

      - name: Stage MK/
        run: |
          npm ci --omit=dev
          mkdir -p MK/lib MK/nester MK/file_rap
          cp *.jsx index.html MK/
          cp lib/* MK/lib/
          cp nester/*.js nester/node.exe MK/nester/
          cp -r node_modules MK/
          # Smoke test: the staged nester loads with its dependencies.
          node -e "require(process.argv[1])" "$PWD/MK/nester/index.js"
          zip -qr MK.zip MK

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" MK.zip --generate-notes
